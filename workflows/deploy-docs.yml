name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Navigation
        run: |
          # 创建 _data 目录
          mkdir -p _data
          # 生成 navigation.yml
          echo "[]" > _data/navigation.yml
          # 遍历仓库中的 .md 文件
          find . -name "*.md" | while read file; do
            # 提取文件名（不带扩展名）
            filename=$(basename "$file" .md)
            # 提取文件路径（不带文件名）
            filepath=$(dirname "$file")
            # 跳过 .github 目录
            if [[ "$filepath" != *".github"* ]]; then
              # 添加到 navigation.yml
              echo "- title: $filename" >> _data/navigation.yml
              echo "  url: $filepath/$filename.html" >> _data/navigation.yml
            fi
          done
      - name: Commit and Push
        uses: ad-m/github-push-file@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          file_content: updated
          file_name: _data/navigation.yml
          commit_message: Update navigation.yml
