<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
        }
        
        .sidebar {
            width: 200px;
            background-color: #f5f5f5;
            padding: 20px;
            position: fixed;
            height: 100%;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            margin-top: 0;
            font-size: 18px;
        }
        
        .sidebar ul {
            list-style-type: none;
            padding: 0;
        }
        
        .sidebar li {
            margin-bottom: 10px;
        }
        
        .sidebar a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 5px;
            border-radius: 4px;
        }
        
        .sidebar a:hover {
            background-color: #e0e0e0;
        }
        
        .content {
            margin-left: 220px;
            padding: 20px;
            width: calc(100% - 220px);
        }
    </style>
</head>
<body>
    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <h2>{{ site.name }}</h2>
        <ul>
            {% for item in site.data.navigation %}
                <li><a href="{{ item.url }}">{{ item.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
    
    <!-- 主内容区域 -->
    <div class="content">
        <h1>欢迎来到我的文档</h1>
        <p>请选择左侧导航栏中的文件查看内容。</p>
    </div>
</body>
</html>
